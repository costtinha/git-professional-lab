name: Training artifacts usage

on:
    workflow_dispatch:

jobs:
    job_1:
        name: Upload artifact
        runs-on: ubuntu-latest
        steps:
            - name: Create local file
              run: echo "Hi this is a text file that will be turned into a github artifact" >> file.txt


            - uses: actions/upload-artifact@v4
              with:
                name: file
                path: file.txt
                retention-days: 1
    
    
    job_2:
        name: Download artifact
        runs-on: ubuntu-latest
        needs: job_1
        steps:
          - uses: actions/download-artifact@v4
            with:
                name: file
          - run: cat file.txt